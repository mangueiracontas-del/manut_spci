name: CI - Testes da API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  executar-testes:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # IMPORTANTE: Adicionamos o "working-directory" nos comandos abaixo
    - name: Instalar dependências da API
      working-directory: ./SUA_PASTA_AQUI  # <-- Troque pelo nome da sua pasta
      run: npm install

    - name: Rodar testes da API
      working-directory: ./SUA_PASTA_AQUI  # <-- Troque pelo nome da sua pasta
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: npm test
