name: CI - Testes da API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  executar-testes:
    runs-on: ubuntu-latest

    steps:
    # 1. Atualizado para v4 (usa Node moderno)
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    # 2. Configura a versão correta do CLI do Supabase
    - name: Configurar Supabase CLI
      uses: supabase/setup-cli@v1.5.0

    # 3. Executa os seus testes com as variáveis de ambiente
    - name: Rodar testes da API
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: npm test
